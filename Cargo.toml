[package]
name = "caiman"
version = "2026.2.0"
edition = "2024"
description = "A TUI keyboard layout inspector with live key event information and theme support."
authors = ["Pombo <https://github.com/pomboverso>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/rama-oi/caiman"
homepage = "https://github.com/rama-oi/caiman"
readme = "readme.md"
keywords = ["keyboard", "layout", "tui", "foss", "open-source"]
categories = ["command-line-utilities"]

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = {version = "1.0.229",  features = ["derive"] }
serde_yaml = "0.9.34"
toml = "0.9"
xkbcommon = "0.9.0"